name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s examples/python -v
      - name: Doctests
        run: python -m doctest examples/python/hello_world.py
      - name: CLI smoke test
        run: |
          test "$(python examples/python/hello_world.py)" = "Hello, World!"
          test "$(python examples/python/hello_world.py Alice)" = "Hello, Alice!"

  java:
    name: Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Smoke test
        run: |
          test "$(java examples/java/HelloWorld.java)" = "Hello, World!"
          test "$(java examples/java/HelloWorld.java Alice)" = "Hello, Alice!"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
